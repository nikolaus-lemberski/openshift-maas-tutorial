apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    opendatahub.io/connections: llama-3-8b
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: llama-3-8b
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  name: llama-3-8b
  namespace: ai-models
spec:
  model:
    uri: oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.1-8b-instruct
  replicas: 1
  template:
    containers:
    - name: main
      args:
      - --dtype=half
      - --max-model-len=20000
      - --gpu-memory-utilization=0.95
      - --enable-auto-tool-choice
      - --tool-call-parser=llama3_json
      - --chat-template=/opt/app-root/template/tool_chat_template_llama3.2_json.jinja
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
  router:
    gateway:
      refs:
      - name: maas-default-gateway
        namespace: openshift-ingress
    route: {}
    scheduler: {}
