---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: standard-plan
  namespace: models-as-a-service
spec:
  priority: 50
  owner:
    groups:
      - name: department-a
    users: []
  tokenMetadata:
    costCenter: CC-1001
    organizationId: ORG-DEPT-A
  modelRefs:
    - name: granite-2b
      namespace: ai-models
      tokenRateLimits:
        - limit: 50000
          window: 1m
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: limited-plan
  namespace: models-as-a-service
spec:
  priority: 10
  owner:
    groups:
      - name: department-b
    users: []
  tokenMetadata:
    costCenter: CC-2001
    organizationId: ORG-DEPT-B
  modelRefs:
    - name: granite-2b
      namespace: ai-models
      tokenRateLimits:
        - limit: 2000
          window: 1m
    - name: tinyllama
      namespace: ai-models
      tokenRateLimits:
        - limit: 1000
          window: 1m
