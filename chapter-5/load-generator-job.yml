apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
  namespace: ai-models
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: load-generator
        image: registry.access.redhat.com/ubi9/python-311
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install --quiet requests urllib3
            python /opt/scripts/load-generator.py
        env:
        - name: MAAS_API_KEY
          valueFrom:
            secretKeyRef:
              name: department-b-api-key
              key: key
        - name: MAAS_URL
          value: "https://$ROUTE_HOST"
        - name: MAAS_MODEL
          value: "qwen3-4b"
        volumeMounts:
        - name: script-volume
          mountPath: /opt/scripts
      volumes:
      - name: script-volume
        configMap:
          name: load-generator-script
      restartPolicy: Never
