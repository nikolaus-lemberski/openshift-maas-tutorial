apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    security.opendatahub.io/authorino-tls-bootstrap: "true"
    opendatahub.io/managed: "false"
  labels:
    app.kubernetes.io/name: maas-gateway
    istio.io/rev: openshift-gateway
    kuadrant.io/gateway: "true"
spec:
  gatewayClassName: $GW_CLASS
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gw-options
  listeners:
  - name: http
    hostname: $ROUTE_HOST
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    hostname: $ROUTE_HOST
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: maas-gw-service-tls
    allowedRoutes:
      namespaces:
        from: All
  # Keep this after https: MaaS discovery selects the first ready HTTPS listener.
  # The OpenShift Router also needs a fallback without an SNI hostname restriction.
  - name: https-router
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: maas-gw-service-tls
    allowedRoutes:
      namespaces:
        from: All
